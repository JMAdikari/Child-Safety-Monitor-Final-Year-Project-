<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Child Safety Monitor</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --line: #2a2f38;
    --text: #e6e8eb;
    --muted: #9aa3ad;
    /* Class colours match the on-frame overlay: fall blue, climb amber,
       normal green. Red is kept for a fired alert alone, so it never doubles
       as a class colour. */
    --fall: #3b82f6;
    --climb: #f59e0b;
    --normal: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }

  /* Tells the browser to render native controls dark; without it the scrollbar
     comes through in the default bright white and dominates the panel. */
  :root { color-scheme: dark; }

  /* The whole page is one screen — only the two side panels scroll inside
     themselves, so the video never leaves the viewport */
  html, body { height: 100%; }
  body {
    margin: 0; padding: 12px 16px; overflow: hidden;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
  }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .chip { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip b {
    color: var(--text); font-weight: 600; font-size: 14px;
    font-variant-numeric: tabular-nums; margin-left: 4px;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--normal); }
  .dot.off { background: var(--muted); }
  .dot.err { background: var(--danger); }
  #status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status b { color: var(--text); font-weight: 600; letter-spacing: .03em; }

  /* min-height:0 on every flex/grid child, or the panels refuse to shrink
     and push the page into a scrollbar */
  .layout {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px;
  }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel > h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600; flex: none;
  }
  /* Children takes whatever is left; alerts sizes itself to its contents and
     only grows to the cap, so a quiet session does not leave a tall empty box
     while the children list is cut off above it. */
  .panel.grow { flex: 1 1 auto; }
  .panel.cap  { flex: 0 1 auto; max-height: 38%; }

  .scroll {
    overflow-y: auto; min-height: 0; flex: 1;
    scrollbar-width: thin;                       /* Firefox */
    scrollbar-color: #39404d transparent;
  }
  /* Chrome and Edge ignore the two properties above, so restate it */
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb {
    background: #39404d; border-radius: 4px;
  }
  .scroll::-webkit-scrollbar-thumb:hover { background: #4a5361; }

  #video {
    flex: 1; min-height: 0; width: 100%;
    object-fit: contain; border-radius: 8px; background: #000;
  }

  .empty { color: var(--muted); font-style: italic; padding: 6px 0; font-size: 13px; }

  /* One child per row: id, what the model says, and which rule is gating it */
  .trk { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .trk:last-child { border-bottom: 0; }
  .trk .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .trk .id { font-weight: 600; }
  .trk .why { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .trk .why.fire { color: var(--danger); font-weight: 600; }
  .trk .why b { color: var(--text); font-weight: 600; }
  /* Name of the rule doing the blocking, so the plain-English line that follows
     can still be traced back to a specific rule in the system */
  .trk .rule {
    display: inline-block; font-size: 10px; text-transform: uppercase;
    letter-spacing: .05em; font-weight: 600; color: var(--muted);
    background: #2a2f38; border-radius: 4px; padding: 1px 6px; margin-top: 5px;
  }

  /* Tinted to its class, so the activity reads at a glance without needing the
     word. Grey is left for 'detecting', where there is no class yet. */
  .pill {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    background: #2a2f38; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .pill.fall   { background: #16294a; color: #93c5fd; }
  .pill.climb  { background: #3a2f1a; color: #fcd34d; }
  .pill.normal { background: #14372a; color: #86efac; }

  .alert {
    border-left: 3px solid var(--line); padding: 6px 9px; margin-bottom: 5px;
    background: #23272f; border-radius: 0 6px 6px 0;
  }
  .alert.fall { border-left-color: var(--fall); }
  .alert.climb { border-left-color: var(--climb); }
  .alert .top { display: flex; justify-content: space-between; gap: 10px; }
  .alert .act { font-weight: 600; text-transform: capitalize; font-size: 13px; }
  .alert .meta { color: var(--muted); font-size: 11px; }
  .count { color: var(--muted); font-size: 11px; font-weight: 400; }
</style>
</head>
<body>

<header>
  <h1>Child Safety Monitor</h1>
  <span id="status"><span class="dot off"></span>connecting…</span>
  <div class="chips">
    <span class="chip">People<b id="people">0</b></span>
    <span class="chip">Frames<b id="frames">0</b></span>
    <span class="chip" title="Frames analysed per second — not the speed of the footage">Processing FPS<b id="fps">0</b></span>
    <span class="chip" title="Position within the clip. This is what the rules measure against.">Video time<b id="vtime">0s</b></span>
  </div>
</header>

<div class="layout">
  <div class="panel">
    <img id="video" src="/video_feed" alt="live view">
  </div>

  <div class="side">
    <div class="panel grow">
      <h2>Children in view <span class="count" id="track-count"></span></h2>
      <div class="scroll" id="tracks"><div class="empty">nobody detected yet</div></div>
    </div>

    <div class="panel cap">
      <h2>Alerts <span class="count" id="alert-count"></span></h2>
      <div class="scroll" id="feed"><div class="empty">no alerts yet</div></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function fmtTime(iso) {
  return iso && iso.length >= 19 ? iso.slice(11, 19) : '';
}

function fmtSecs(s) {
  s = Math.round(s);
  if (s < 60) return s + 's';
  return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
}

function renderStatus(d) {
  const el = $('status');
  if (d.error) {
    el.innerHTML = '<span class="dot err"></span>stopped — ' + d.error;
  } else if (d.running) {
    el.innerHTML = '<span class="dot on"></span>running';
  } else if (d.finished) {
    // The video panel goes black at the end, so the summary is reported here
    const n = d.alert_total ?? 0;
    el.innerHTML = '<span class="dot off"></span><b>VIDEO ENDED</b> — '
      + `${d.frames ?? 0} frames analysed, ${n} alert${n === 1 ? '' : 's'} raised`;
  } else {
    el.innerHTML = '<span class="dot off"></span>starting…';
  }
}

// A setting may be per class or a single number covering both
function forClass(setting, cls) {
  if (setting === null || setting === undefined) return null;
  return typeof setting === 'object' ? setting[cls] : setting;
}

// Which deterministic rule is holding this child back, said in plain words so
// a viewer who does not know the system can still follow it. Reads the live
// config, so a run started with different flags describes itself honestly.
function ruleDetail(t, rules) {
  const cls = t.activity;
  const p = t.progress;

  if (t.alert) return {text: 'ALERT — every rule passed', fire: true};

  if (cls === 'pending')
    return {text: 'Just appeared — collecting frames before the model can judge'};
  if (cls === 'normal')
    return {text: 'Standing or moving normally'};

  switch (t.rejected_by) {
    case 'threshold': {
      const need = rules ? forClass(rules.threshold?.value, cls) : null;
      const have = (t.confidence * 100).toFixed(0);
      return {rule: 'Confidence', text: need != null
        ? `Only ${have}% sure this is ${cls} — needs ${(need * 100).toFixed(0)}% to raise an alert`
        : `Only ${have}% sure this is ${cls} — below the required level`};
    }
    case 'duration': {
      if (!p) return {rule: 'Duration', text: 'Has not gone on long enough yet'};
      const left = Math.max(0, p.need_seconds - p.seconds);
      return {rule: 'Duration',
        text: `Seen ${cls} for ${p.seconds.toFixed(1)}s so far — must continue for `
            + `${p.need_seconds}s (about ${left.toFixed(1)}s to go), `
            + `and for ${p.need_frames} frames (${p.frames} so far)`};
    }
    case 'geometry': {
      return {rule: 'Body position', text: cls === 'fall'
        ? 'The body never tilted over, so this cannot be a fall'
        : 'The hips are not raised above the feet, so this cannot be a climb'};
    }
    case 'cooldown': {
      const secs = rules?.cooldown?.seconds;
      return {rule: 'Cooldown',
        text: `Already alerted for this child${secs ? ` — waiting ${secs}s before alerting again` : ''}`};
    }
    default:
      return {text: 'Waiting'};
  }
}

function renderTracks(tracks, rules) {
  $('track-count').textContent = tracks.length ? `(${tracks.length})` : '';
  if (!tracks.length) {
    $('tracks').innerHTML = '<div class="empty">nobody detected yet</div>';
    return;
  }
  $('tracks').innerHTML = tracks.map(t => {
    // 'pending' has no class yet, so it keeps the neutral grey pill
    const cls = t.activity === 'pending' ? '' : t.activity;
    const pct = t.activity === 'pending' ? '' : Math.round(t.confidence * 100) + '%';
    const r = ruleDetail(t, rules);
    // Only a blocked track names a rule; normal and warm-up have none to name
    const tag = r.rule ? `<div class="rule">${r.rule} rule</div>` : '';

    return `<div class="trk">
      <div class="top">
        <span class="id">child #${t.track_id}</span>
        <span class="pill ${cls}">${t.activity} ${pct}</span>
      </div>${tag}
      <div class="why ${r.fire ? 'fire' : ''}">${r.text}</div>
    </div>`;
  }).join('');
}

function renderAlerts(alerts, total) {
  const n = total ?? alerts.length;
  $('alert-count').textContent = n ? `(${n})` : '';
  $('feed').innerHTML = alerts.length
    ? alerts.map(a => `
        <div class="alert ${a.activity}">
          <div class="top">
            <span class="act">${a.activity}</span>
            <span class="meta">${fmtTime(a.timestamp)}</span>
          </div>
          <div class="meta">child #${a.person_id} · model confidence ${Math.round(a.confidence * 100)}%</div>
        </div>`).join('')
    : '<div class="empty">no alerts yet</div>';
}

let timer = null;

async function tick() {
  try {
    const d = await (await fetch('/api/state')).json();
    renderStatus(d);

    // Once the run is over the state cannot change again, so stop polling.
    // Without this the page kept requesting once a second indefinitely.
    if ((d.finished || d.error) && timer !== null) {
      clearInterval(timer);
      timer = null;
    }
    $('people').textContent = d.people ?? 0;
    $('frames').textContent = d.frames ?? 0;
    $('fps').textContent = d.fps ?? 0;
    $('vtime').textContent = fmtSecs(d.video_time_sec ?? d.uptime_sec ?? 0);
    renderTracks(d.tracks || [], d.rules);
    renderAlerts(d.alerts || [], d.alert_total);
  } catch (e) {
    $('status').innerHTML = '<span class="dot err"></span>server unreachable';
  }
}

tick();
timer = setInterval(tick, 1000);
</script>

</body>
</html>
